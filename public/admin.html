<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遇见 · 管理后台</title>
<meta name="robots" content="noindex, nofollow">
<style>
/* =========================== CSS Reset & Variables =========================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#0960bd;--primary-hover:#0078d4;--primary-active:#005a9e;--primary-light:rgba(9,96,189,.08);
  --success:#55d187;--warning:#efbd47;--danger:#ed6c6c;--info:#909399;
  --bg:#f0f2f5;--bg-card:#fff;--bg-header:#fff;--bg-sidebar:#001529;--bg-sidebar-hover:#002140;--bg-sidebar-active:#0960bd;
  --text:#303133;--text-secondary:#606266;--text-muted:#909399;--text-placeholder:#c0c4cc;
  --border:#dcdfe6;--border-light:#e4e7ed;--border-lighter:#ebeef5;--border-extra-light:#f2f6fc;
  --radius:6px;--radius-lg:10px;--radius-sm:4px;
  --shadow:0 1px 2px rgba(0,0,0,.03),0 1px 6px -1px rgba(0,0,0,.02),0 2px 4px rgba(0,0,0,.02);
  --shadow-lg:0 4px 16px rgba(0,0,0,.08);--shadow-xl:0 12px 32px rgba(0,0,0,.12);
  --sidebar-width:220px;--sidebar-collapsed:64px;--header-height:48px;
  --transition:all .2s cubic-bezier(.4,0,.2,1);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;-webkit-font-smoothing:antialiased;}

/* =========================== Layout =========================== */
.app-layout{display:flex;min-height:100vh;width:100%}

/* Sidebar */
.sidebar{
  position:fixed;top:0;left:0;bottom:0;z-index:1001;
  width:var(--sidebar-width);background:var(--bg-sidebar);
  display:flex;flex-direction:column;
  transition:var(--transition);overflow:hidden;
  box-shadow:2px 0 8px rgba(0,0,0,.15);
}
.sidebar.collapsed{width:var(--sidebar-collapsed)}
.sidebar-logo{
  height:var(--header-height);display:flex;align-items:center;padding:0 16px;
  color:#fff;font-size:16px;font-weight:700;white-space:nowrap;
  border-bottom:1px solid rgba(255,255,255,.08);
  overflow:hidden;
}
.sidebar-logo .logo-icon{width:32px;height:32px;border-radius:6px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.sidebar-logo .logo-text{margin-left:10px;opacity:1;transition:opacity .15s}
.sidebar.collapsed .logo-text{opacity:0;width:0;margin-left:0}
.sidebar-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:8px 0}
.sidebar-nav::-webkit-scrollbar{width:4px}
.sidebar-nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:2px}
.sidebar-nav a{
  display:flex;align-items:center;height:44px;padding:0 20px;color:rgba(255,255,255,.65);text-decoration:none;
  font-size:14px;cursor:pointer;transition:var(--transition);white-space:nowrap;
  border-left:3px solid transparent;overflow:hidden;
}
.sidebar-nav a:hover{color:#fff;background:var(--bg-sidebar-hover)}
.sidebar-nav a.active{color:#fff;background:var(--bg-sidebar-active);border-left-color:#fff}
.sidebar-nav a .nav-icon{width:20px;text-align:center;margin-right:10px;font-size:16px;flex-shrink:0}
.sidebar-nav a .nav-title{opacity:1;transition:opacity .15s}
.sidebar.collapsed .nav-title{opacity:0;width:0}
.sidebar-nav a .nav-badge{margin-left:auto;background:var(--danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;min-width:18px;text-align:center}
.sidebar.collapsed .nav-badge{display:none}
.sidebar-collapse{
  height:40px;display:flex;align-items:center;justify-content:center;
  color:rgba(255,255,255,.65);cursor:pointer;font-size:16px;
  border-top:1px solid rgba(255,255,255,.08);transition:var(--transition);flex-shrink:0;
}
.sidebar-collapse:hover{color:#fff;background:var(--bg-sidebar-hover)}

/* Main */
.main{flex:1;margin-left:var(--sidebar-width);transition:var(--transition);min-width:0;position:relative}
.main.expanded{margin-left:var(--sidebar-collapsed)}

/* Header */
.header{
  height:var(--header-height);background:var(--bg-header);border-bottom:1px solid var(--border-lighter);
  display:flex;align-items:center;justify-content:space-between;padding:0 20px;
  position:sticky;top:0;z-index:100;box-shadow:0 1px 4px rgba(0,0,0,.04);
}
.header-left{display:flex;align-items:center;gap:12px}
.header-breadcrumb{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--text-muted)}
.header-breadcrumb span{color:var(--text);font-weight:600}
.header-right{display:flex;align-items:center;gap:16px}
.header-right .user{font-size:13px;color:var(--text-secondary);display:flex;align-items:center;gap:6px}
.header-right .user-avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.hamburger{display:none;font-size:20px;cursor:pointer;color:var(--text);padding:4px}
.collapse-btn{font-size:16px;cursor:pointer;color:var(--text-muted);padding:4px 6px;border-radius:4px;transition:var(--transition)}
.collapse-btn:hover{color:var(--primary);background:var(--primary-light)}

/* Content */
.content{padding:20px;min-height:calc(100vh - var(--header-height))}

/* =========================== Components =========================== */

/* Stat Cards */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px;margin-bottom:20px}
.stat-card{
  background:var(--bg-card);border-radius:var(--radius);padding:18px 20px;
  box-shadow:var(--shadow);border:1px solid var(--border-lighter);
  display:flex;align-items:flex-start;gap:14px;transition:var(--transition);cursor:default;
}
.stat-card.clickable{cursor:pointer}
.stat-card.clickable:hover{transform:translateY(-1px);border-color:var(--primary)}
.stat-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.stat-card .card-icon{
  width:44px;height:44px;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.stat-card .card-info{flex:1;min-width:0}
.stat-card .card-label{font-size:13px;color:var(--text-secondary);margin-bottom:4px}
.stat-card .card-value{font-size:26px;font-weight:700;line-height:1.2}
.stat-card .card-sub{font-size:12px;color:var(--text-muted);margin-top:4px;display:flex;align-items:center;gap:4px}
.stat-card .card-trend{font-size:12px;display:inline-flex;align-items:center;gap:2px}
.stat-card .card-trend.up{color:var(--success)}.stat-card .card-trend.down{color:var(--danger)}

/* Section */
.section-card{
  background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);
  border:1px solid var(--border-lighter);margin-bottom:20px;
}
.section-header{padding:14px 20px;border-bottom:1px solid var(--border-lighter);display:flex;align-items:center;justify-content:space-between}
.section-header h3{font-size:15px;font-weight:600}
.section-body{padding:16px 20px}

/* Toolbar */
.toolbar{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.toolbar input,.toolbar select{
  height:32px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-sm);
  font-size:13px;color:var(--text);outline:none;background:#fff;transition:var(--transition);
}
.toolbar input:focus,.toolbar select:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light)}
.toolbar input{width:180px}.toolbar input.sm{width:80px}.toolbar input.date{width:130px}
.toolbar .spacer{flex:1}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 14px;
  border:none;border-radius:var(--radius-sm);font-size:13px;cursor:pointer;
  transition:var(--transition);white-space:nowrap;font-weight:500;
}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover)}
.btn-success{background:var(--success);color:#fff}.btn-success:hover{opacity:.85}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{opacity:.85}
.btn-warning{background:var(--warning);color:#fff}
.btn-default{background:#fff;color:var(--text);border:1px solid var(--border)}.btn-default:hover{color:var(--primary);border-color:var(--primary)}
.btn-text{background:transparent;color:var(--text-secondary);padding:0 8px}.btn-text:hover{color:var(--primary)}
.btn-sm{height:28px;padding:0 10px;font-size:12px}
.btn-xs{height:24px;padding:0 8px;font-size:11px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Table */
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border-lighter)}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{
  background:#fafafa;padding:10px 12px;text-align:left;font-weight:600;color:var(--text-secondary);
  border-bottom:1px solid var(--border);white-space:nowrap;font-size:12px;
}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border-lighter);color:var(--text)}
tbody tr:hover td{background:var(--primary-light)}
tbody tr:last-child td{border-bottom:none}
.empty-row td{text-align:center;padding:48px 20px;color:var(--text-muted);font-size:14px}

/* Tags */
.tag{display:inline-block;padding:1px 8px;border-radius:3px;font-size:11px;font-weight:500;line-height:1.6}
.tag-success{background:#e8f8ef;color:#28784a}
.tag-danger{background:#fde8e8;color:#b83c3c}
.tag-warning{background:#fef3e2;color:#8a611c}
.tag-default{background:#f0f2f5;color:#606266}
.tag-primary{background:#e8f0fe;color:#1a56db}

/* Pagination */
.pagination{display:flex;align-items:center;gap:6px;padding-top:14px;font-size:13px;flex-wrap:wrap}
.pagination .page-btn{
  min-width:32px;height:32px;border:1px solid var(--border);background:#fff;border-radius:var(--radius-sm);
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:var(--transition);
}
.pagination .page-btn:hover{border-color:var(--primary);color:var(--primary)}
.pagination .page-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pagination .page-btn:disabled{opacity:.4;cursor:not-allowed}
.pagination .page-info{color:var(--text-muted);margin:0 4px}

/* Summary */
.summary-row{display:flex;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.summary-item{background:var(--bg-card);padding:10px 16px;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border-lighter);font-size:13px;color:var(--text-secondary)}
.summary-item strong{font-size:18px;color:var(--text);margin:0 2px}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:14px;border-bottom:1px solid var(--border)}
.tabs button{padding:8px 16px;border:none;background:transparent;cursor:pointer;font-size:13px;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px;transition:var(--transition)}
.tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tabs button:hover{color:var(--primary)}

/* Toggle */
.toggle{position:relative;display:inline-block;width:38px;height:22px}
.toggle input{display:none}
.toggle-slider{position:absolute;top:0;left:0;right:0;bottom:0;background:#c0c4cc;border-radius:22px;cursor:pointer;transition:.2s}
.toggle-slider::before{content:"";position:absolute;width:18px;height:18px;left:2px;bottom:2px;background:#fff;border-radius:50%;transition:.2s}
.toggle input:checked+.toggle-slider{background:var(--success)}
.toggle input:checked+.toggle-slider::before{transform:translateX(16px)}

/* Chart */
.chart-wrap{background:var(--bg-card);border-radius:var(--radius);padding:16px 20px;box-shadow:var(--shadow);border:1px solid var(--border-lighter);margin-bottom:16px}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.chart-header h4{font-size:14px;font-weight:600}
.bar-chart{display:flex;align-items:flex-end;gap:8px;height:180px;padding-top:8px}
.bar-item{flex:1;display:flex;flex-direction:column;align-items:center;min-width:28px}
.bar-fill{width:100%;max-width:44px;background:var(--primary);border-radius:4px 4px 0 0;min-height:2px;transition:height .5s cubic-bezier(.4,0,.2,1);position:relative;cursor:pointer}
.bar-fill:hover{filter:brightness(1.1)}
.bar-label{font-size:10px;color:var(--text-muted);margin-top:5px;transform:rotate(-35deg);transform-origin:top left;white-space:nowrap}
.bar-value{font-size:11px;color:var(--text-secondary);margin-bottom:3px;font-weight:600}

/* Modal */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:2000;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:var(--radius-lg);padding:24px;max-width:520px;width:92vw;max-height:82vh;overflow-y:auto;box-shadow:var(--shadow-xl)}
.modal h3{font-size:16px;margin-bottom:18px;font-weight:600}
.modal .form-item{margin-bottom:14px}
.modal .form-item label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:4px;font-weight:500}
.modal .form-item input,.modal .form-item select,.modal .form-item textarea{
  width:100%;height:34px;padding:0 10px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:13px;outline:none;transition:var(--transition)
}
.modal .form-item input:focus,.modal .form-item select:focus,.modal .form-item textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-light)}
.modal .form-item textarea{height:auto;padding:8px 10px;resize:vertical;min-height:60px}
.modal .form-row{display:flex;gap:10px}
.modal .form-row .form-item{flex:1}
.modal-footer{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border-lighter)}

/* Confirm */
.confirm-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:2100;align-items:center;justify-content:center}
.confirm-overlay.show{display:flex}
.confirm-box{background:#fff;border-radius:var(--radius-lg);padding:28px 24px;max-width:400px;width:90vw;text-align:center;box-shadow:var(--shadow-xl)}
.confirm-box .confirm-icon{font-size:44px;margin-bottom:12px}
.confirm-box p{font-size:14px;color:var(--text);margin-bottom:20px;line-height:1.6}
.confirm-box .confirm-actions{display:flex;gap:10px;justify-content:center}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-120px);z-index:9999;padding:10px 20px;border-radius:var(--radius);color:#fff;font-size:13px;box-shadow:var(--shadow-lg);transition:transform .3s;pointer-events:none}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
.toast.info{background:var(--primary)}

/* Loading */
.spinner{display:inline-block;width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-center{display:flex;align-items:center;justify-content:center;padding:60px 20px;gap:10px;color:var(--text-muted);font-size:14px}

/* Login */
.login-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#001529 0%,#003366 50%,#001529 100%);z-index:9999;align-items:center;justify-content:center;flex-direction:column}
.login-overlay.show{display:flex}
.login-card{background:#fff;border-radius:12px;padding:36px 32px;width:380px;max-width:92vw;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.login-card .login-logo{text-align:center;font-size:20px;font-weight:700;margin-bottom:4px;color:var(--text)}
.login-card .login-sub{text-align:center;font-size:13px;color:var(--text-muted);margin-bottom:24px}
.login-card .login-error{color:var(--danger);font-size:12px;text-align:center;margin-top:6px;min-height:18px}
.login-card .form-item{margin-bottom:14px}
.login-card .form-item label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:4px}
.login-card .form-item input{width:100%;height:38px;padding:0 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:14px;outline:none}
.login-card .form-item input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.login-card .form-row{display:flex;gap:10px;align-items:flex-end}
.login-card .form-row .form-item{flex:1;margin-bottom:0}

/* Responsive */
@media (max-width:1024px){
  .sidebar{transform:translateX(-100%)}.sidebar.mobile-open{transform:translateX(0)}
  .sidebar-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000}
  .sidebar-overlay.show{display:block}
  .main{margin-left:0!important}.hamburger{display:block}.collapse-btn{display:none}
  .content{padding:12px}
  .stat-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .toolbar{flex-direction:column;align-items:stretch}.toolbar input,.toolbar select{width:100%!important}
  .summary-row{flex-direction:column}.header{padding:0 12px}
}
@media (max-width:480px){
  .stat-grid{grid-template-columns:1fr 1fr;gap:8px}
  .stat-card{padding:12px;gap:8px}.stat-card .card-value{font-size:20px}
  .stat-card .card-icon{width:34px;height:34px;font-size:16px}
  table{font-size:12px}thead th,tbody td{padding:8px 6px}
}

/* Refresh Bar */
.refresh-bar{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:12px;color:var(--text-muted);flex-wrap:wrap}
.refresh-bar .dot{width:7px;height:7px;border-radius:50%;background:var(--success);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.refresh-bar .dot.paused{background:var(--warning);animation:none}

/* Skeleton loading for dashboard cards */
.skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:4px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Link (clickable username) */
.link{color:var(--primary);cursor:pointer;font-weight:600}
.link:hover{text-decoration:underline}

/* Permission checkbox grid (admin form) */
.perm-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.perm-item{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:var(--radius-sm);padding:5px 10px;font-size:12px;cursor:pointer;background:#fafafa;transition:var(--transition);user-select:none}
.perm-item:hover{border-color:var(--primary)}
.perm-item.checked{background:var(--primary-light);border-color:var(--primary);color:var(--primary)}
.perm-item input{display:none}
.perm-group-label{font-size:12px;color:var(--text-muted);margin:10px 0 4px;font-weight:600}

/* User detail modal */
.ud-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--text-secondary);margin:10px 0 14px}
.ud-meta span{display:inline-flex;align-items:center;gap:4px}
.ud-photos{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.ud-photos img{width:74px;height:74px;border-radius:6px;object-fit:cover;border:1px solid var(--border-lighter);cursor:pointer;transition:var(--transition)}
.ud-photos img:hover{border-color:var(--primary);transform:scale(1.03)}
.msg-line{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Full-screen user detail overlay */
.ud-overlay{position:absolute;top:0;left:0;right:0;bottom:0;z-index:1500;background:var(--bg);display:flex;flex-direction:column}
.ud-header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--border-lighter);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.ud-header-info{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px}
.ud-header-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:1px solid var(--border-lighter)}
.ud-header-title{font-size:15px;font-weight:600}
.ud-header-sub{font-size:12px;color:var(--text-muted)}
.ud-header-actions{display:flex;gap:8px;flex-wrap:wrap}
.ud-tabs{display:flex;padding:0 16px;background:#fff;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.ud-tabs button{padding:10px 14px;border:none;background:transparent;cursor:pointer;font-size:13px;color:var(--text-secondary);border-bottom:2px solid transparent;transition:var(--transition);white-space:nowrap}
.ud-tabs button.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.ud-tabs button:hover{color:var(--primary)}
.ud-body{flex:1;overflow-y:auto;padding:16px}

/* 动态详情卡片 */
.post-card{background:#fff;border:1px solid var(--border-lighter);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px}
.post-card .post-content{white-space:pre-wrap;font-size:14px;line-height:1.6;margin-bottom:10px}
.post-card .post-imgs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.post-card .post-imgs img{width:84px;height:84px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--border-lighter);transition:var(--transition)}
.post-card .post-imgs img:hover{border-color:var(--primary)}
.post-card .post-meta{display:flex;gap:14px;font-size:12px;color:var(--text-muted);margin-bottom:8px;flex-wrap:wrap}
.post-card .post-likers{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--text-secondary);align-items:center;margin-bottom:8px}
.post-card .post-likers img{width:20px;height:20px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:2px}
.post-card .post-comments{border-top:1px solid var(--border-extra-light);padding-top:8px}
.post-card .comment-item{padding:6px 0;font-size:13px;line-height:1.5}
.post-card .comment-item .c-nick{font-weight:600;color:var(--text-secondary);margin-right:6px}
.post-card .comment-item .c-time{font-size:11px;color:var(--text-muted);margin-left:6px}
.post-card .comment-item .c-reply{margin-left:18px;padding-left:10px;border-left:2px solid var(--border-extra-light);margin-top:4px}

/* 消息分组（手风琴） */
.msg-group{background:#fff;border:1px solid var(--border-lighter);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
.msg-group-head{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;transition:var(--transition)}
.msg-group-head:hover{background:var(--primary-light)}
.msg-group-head img{width:34px;height:34px;border-radius:50%;object-fit:cover}
.msg-group-head .mg-info{flex:1;min-width:0}
.msg-group-head .mg-name{font-size:13px;font-weight:600}
.msg-group-head .mg-sub{font-size:11px;color:var(--text-muted);margin-top:2px}
.msg-group-head .mg-arrow{color:var(--text-muted);font-size:12px;transition:var(--transition)}
.msg-group.open .mg-arrow{transform:rotate(90deg)}
.msg-group-body{display:none;padding:8px 14px;border-top:1px solid var(--border-extra-light);background:#fafafa}
.msg-group.open .msg-group-body{display:block}
.msg-bubble{display:flex;margin:6px 0;gap:8px}
.msg-bubble .mb-avatar{width:26px;height:26px;border-radius:50%;object-fit:cover;flex-shrink:0;margin-top:2px}
.msg-bubble.sent{justify-content:flex-end}
.msg-bubble.sent .mb-content{background:var(--primary);color:#fff}
.msg-bubble.received .mb-content{background:#fff;border:1px solid var(--border-lighter)}
.msg-bubble .mb-content{max-width:70%;padding:7px 12px;border-radius:10px;font-size:13px;line-height:1.5;word-break:break-word}
.msg-bubble .mb-content img{max-width:160px;border-radius:6px;cursor:pointer;display:block}
.msg-bubble .mb-time{font-size:10px;color:var(--text-muted);align-self:flex-end;flex-shrink:0}

/* 行为聚合 */
.beh-block{margin-bottom:20px}
.beh-block-title{font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.beh-item{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid var(--border-lighter);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:6px;font-size:13px}
.beh-item img{width:24px;height:24px;border-radius:50%;object-fit:cover;flex-shrink:0;margin-top:1px}
.beh-item .bi-info{flex:1;min-width:0}
.beh-item .bi-main{color:var(--text)}
.beh-item .bi-sub{font-size:11px;color:var(--text-muted);margin-top:2px}

/* Image preview overlay (复刻 app 端，z-index 高于全屏层) */
.img-preview-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:3000;align-items:center;justify-content:center}
.img-preview-overlay.show{display:flex}
.img-preview-img{max-width:92vw;max-height:88vh;object-fit:contain;transition:transform .25s;cursor:zoom-in}
.img-preview-img.scale-2x{transform:scale(2);cursor:zoom-out}
.img-preview-close{position:fixed;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;font-size:20px;cursor:pointer;z-index:3001;display:flex;align-items:center;justify-content:center}
.img-preview-nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;border:none;font-size:24px;cursor:pointer;z-index:3001;display:flex;align-items:center;justify-content:center}
.img-preview-nav.prev{left:16px}
.img-preview-nav.next{right:16px}
.img-preview-counter{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;z-index:3001}

</style>
</head>
<body>

<script>
// ============================================================
//  State
// ============================================================
const S = {
  token: null,
  adminUser: null,
  page: 'dashboard',
  pageSize: 20,
  refreshTimer: null,
  sidebarCollapsed: false,
  filters: {},
  perms: [],          // 当前管理员权限点（来自 /api/admin/me）
  role: 'user',       // 当前管理员角色
  rolePermissions: {},// 角色默认权限模板（来自 /api/admin/me）
  permCatalog: [],    // 权限中文目录（来自 /api/admin/me）
  me: null            // 当前管理员完整信息
};

// 页面 → 所需权限点映射（super_admin 全部可见）
const PAGE_PERMS = {
  users: 'user_view', posts: 'content_audit', reports: 'report_handle',
  orders: 'data_view', gifts: 'data_view', 'gift-records': 'data_view',
  transactions: 'data_view', revenue: 'data_view', audit: 'content_audit',
  'sensitive-words': 'content_audit', announcements: 'admin_manage',
  configs: 'admin_manage', admins: 'admin_manage', push: 'push_send',
  verifications: 'verification_audit'
};

// 权限目录兜底（/me 获取失败时保证权限勾选 UI 可用）
const FALLBACK_CATALOG = [
  {key:'user_view',label:'查看用户',group:'用户管理'},
  {key:'user_edit',label:'修改用户资料/重置密码/备注',group:'用户管理'},
  {key:'user_ban',label:'封禁/解封用户',group:'用户管理'},
  {key:'content_audit',label:'内容审核/敏感词/动态管理',group:'内容管理'},
  {key:'report_handle',label:'处理举报',group:'内容管理'},
  {key:'verification_audit',label:'认证审核',group:'内容管理'},
  {key:'data_view',label:'查看数据/订单/礼物/流水',group:'数据运营'},
  {key:'push_send',label:'发送推送',group:'数据运营'},
  {key:'admin_manage',label:'管理员/公告/系统配置',group:'系统管理'}
];

const PAGE_NAMES = {
  dashboard:'仪表盘',users:'用户管理',posts:'动态管理',reports:'举报管理',
  orders:'订单管理',gifts:'礼物管理','gift-records':'礼物记录',
  transactions:'交易流水',revenue:'营收统计',
  audit:'内容审核','sensitive-words':'敏感词管理',announcements:'公告管理',
  configs:'系统配置',admins:'管理员管理',push:'推送管理',verifications:'认证审核'
};

// ============================================================ Init ============================================================
(function init(){
  const t = localStorage.getItem('ad_token');
  const u = localStorage.getItem('ad_user');
  if (t && u) {
    try {
      S.token = t;
      S.adminUser = JSON.parse(u);
      // 验证 token 是否过期（简单检查：解码 JWT payload 中的 exp）
      const payload = JSON.parse(atob(t.split('.')[1]));
      if (payload.exp * 1000 > Date.now()) {
        showApp();
        startClock();
        return;
      }
    } catch(e) { /* token 无效，回退到登录 */ }
  }
  clearStoredAuth();
  showLogin();
  startClock();
})();

function startClock(){
  setInterval(()=>{
    const el = document.getElementById('header-time');
    if (el) el.textContent = new Date().toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }, 1000);
}

function clearStoredAuth(){
  localStorage.removeItem('ad_token');
  localStorage.removeItem('ad_user');
  S.token = null; S.adminUser = null;
}

// ============================================================ Auth ============================================================
function showLogin(){
  document.getElementById('login-overlay').classList.add('show');
  document.getElementById('app-layout').style.display = 'none';
}

function showApp(){
  document.getElementById('login-overlay').classList.remove('show');
  document.getElementById('app-layout').style.display = 'flex';
  document.getElementById('header-user').textContent = S.adminUser?.nickname || '管理员';
  document.getElementById('header-avatar').textContent = (S.adminUser?.nickname || '管')[0];
  fetchAdminMe();
}

// ============================================================ 权限初始化 ============================================================
async function fetchAdminMe(){
  try {
    const me = (await api('GET','/api/admin/me')).data;
    S.me = me;
    S.role = me.admin?.admin_role || 'user';
    S.perms = (me.admin?.permissions && Array.isArray(me.admin.permissions)) ? me.admin.permissions : ['*'];
    S.rolePermissions = me.role_permissions || {};
    S.permCatalog = me.permission_catalog || [];
    // 同步 header 用户信息
    if (me.user?.nickname) {
      S.adminUser = Object.assign({}, S.adminUser, { nickname: me.user.nickname, role: S.role, permissions: S.perms });
      localStorage.setItem('ad_user', JSON.stringify(S.adminUser));
      document.getElementById('header-user').textContent = me.user.nickname;
      document.getElementById('header-avatar').textContent = me.user.nickname[0];
    }
  } catch(e){
    // 获取权限失败（DB 降级等）→ 放开全部，保证可用
    S.perms = ['*'];
    S.role = 'admin';
    S.permCatalog = S.permCatalog.length ? S.permCatalog : FALLBACK_CATALOG;
    if (!Object.keys(S.rolePermissions).length) S.rolePermissions = {};
  }
  renderSidebar();
  // 若当前页无权限，回落到仪表盘
  const need = PAGE_PERMS[S.page];
  if (need && !hasPerm(need)) { navigate('dashboard'); return; }
  navigate(S.page);
}

function hasPerm(perm){
  return S.role === 'super_admin' || S.perms.includes('*') || S.perms.includes(perm);
}

function renderSidebar(){
  const isSuper = S.role === 'super_admin' || S.perms.includes('*');
  document.querySelectorAll('#sidebar-nav a[data-page]').forEach(a=>{
    const page = a.getAttribute('data-page');
    const need = PAGE_PERMS[page];
    a.style.display = (isSuper || !need || hasPerm(need)) ? '' : 'none';
  });
}

function setLoginError(msg){
  const el = document.getElementById('login-error');
  el.textContent = msg || '';
}

async function sendLoginCode(){
  const phone = document.getElementById('login-phone').value.trim();
  if (!/^1[3-9]\d{9}$/.test(phone)) { setLoginError('请输入有效的手机号'); return; }
  const btn = document.getElementById('btn-send-code');
  btn.disabled = true; btn.textContent = '发送中...';
  try {
    const resp = await fetch('/api/auth/send-code',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone})
    });
    const d = await resp.json();
    if (d.code === 0) {
      toast('验证码已发送','success');
      if (d.data?.code) { document.getElementById('login-code').value = d.data.code; toast('开发模式：已自动填入','info'); }
      let cd = 60;
      const iv = setInterval(()=>{
        if (cd<=0){clearInterval(iv);btn.disabled=false;btn.textContent='获取验证码';return;}
        btn.textContent = cd+'s'; cd--;
      },1000);
      setLoginError('');
    } else {
      setLoginError(d.message||'发送失败'); btn.disabled = false; btn.textContent = '获取验证码';
    }
  } catch(e){ setLoginError('网络错误'); btn.disabled = false; btn.textContent = '获取验证码'; }
}

async function adminLogin(){
  const phone = document.getElementById('login-phone').value.trim();
  const code = document.getElementById('login-code').value.trim();
  if (!phone || !code) { setLoginError('请填写手机号和验证码'); return; }
  try {
    const resp = await fetch('/api/auth/login',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({login:phone,code})
    });
    const d = await resp.json();
    if (d.code === 0 && d.data) {
      if (d.data.user.role !== 'admin') { setLoginError('该账号不是管理员，无法登录'); return; }
      S.token = d.data.token;
      S.adminUser = d.data.user;
      localStorage.setItem('ad_token', S.token);
      localStorage.setItem('ad_user', JSON.stringify(S.adminUser));
      setLoginError('');
      showApp();
      toast('登录成功','success');
    } else {
      setLoginError(d.message||'登录失败');
    }
  } catch(e){ setLoginError('网络错误，请重试'); }
}

function logout(){
  if (S.refreshTimer) { clearInterval(S.refreshTimer); S.refreshTimer = null; }
  clearStoredAuth();
  document.getElementById('login-phone').value = '';
  document.getElementById('login-code').value = '';
  setLoginError('');
  showLogin();
}

// ============================================================ API ============================================================
async function api(method, path, body){
  const headers = {'Content-Type':'application/json'};
  if (S.token) headers['Authorization'] = 'Bearer ' + S.token;
  const opts = {method,headers};
  if (body) opts.body = JSON.stringify(body);
  const resp = await fetch(path, opts);
  const data = await resp.json();
  if (resp.status === 401 || data.code === 401) {
    clearStoredAuth();
    showLogin();
    toast('登录已过期，请重新登录','error');
    throw new Error('Unauthorized');
  }
  if (data.code !== 0 && data.code !== undefined) {
    throw new Error(data.message || '请求失败');
  }
  return data;
}

// ============================================================ Navigation ============================================================
function navigate(page){
  if (S.refreshTimer) { clearInterval(S.refreshTimer); S.refreshTimer = null; }
  // 权限守卫：无权限页面回落到仪表盘
  const need = PAGE_PERMS[page];
  if (need && !hasPerm(need)) { page = 'dashboard'; }
  S.page = page;
  S.filters = {};
  document.querySelectorAll('#sidebar-nav a').forEach(a=>a.classList.remove('active'));
  const link = document.querySelector(`#sidebar-nav a[data-page="${page}"]`);
  if (link) link.classList.add('active');
  document.getElementById('page-title').textContent = PAGE_NAMES[page]||page;
  if (window.innerWidth <= 1024) closeMobileSidebar();
  switch(page){
    case 'dashboard': renderDashboard(); break;
    case 'users': renderUsers(); break;
    case 'posts': renderPosts(); break;
    case 'reports': renderReports(); break;
    case 'orders': renderOrders(); break;
    case 'gifts': renderGifts(); break;
    case 'gift-records': renderGiftRecords(); break;
    case 'transactions': renderTransactions(); break;
    case 'revenue': renderRevenue(); break;
    case 'audit': renderAudit(); break;
    case 'sensitive-words': renderSensitiveWords(); break;
    case 'announcements': renderAnnouncements(); break;
    case 'configs': renderConfigs(); break;
    case 'admins': renderAdmins(); break;
    case 'push': renderPush(); break;
    case 'verifications': renderVerifications(); break;
  }
}

// ============================================================ Sidebar ============================================================
function toggleSidebarCollapse(){
  S.sidebarCollapsed = !S.sidebarCollapsed;
  document.getElementById('sidebar').classList.toggle('collapsed', S.sidebarCollapsed);
  document.getElementById('main-area').classList.toggle('expanded', S.sidebarCollapsed);
  localStorage.setItem('ad_sidebar', S.sidebarCollapsed?'1':'0');
}
// 恢复折叠状态
(function(){
  if (localStorage.getItem('ad_sidebar') === '1') {
    S.sidebarCollapsed = true;
    setTimeout(()=>{
      document.getElementById('sidebar').classList.add('collapsed');
      document.getElementById('main-area').classList.add('expanded');
    },100);
  }
})();

function toggleMobileSidebar(){
  document.getElementById('sidebar').classList.toggle('mobile-open');
  document.getElementById('sidebar-overlay').classList.toggle('show');
}
function closeMobileSidebar(){

function fmtTime(ts){if(!ts)return'-';const d=new Date(ts);const p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function fmtMoney(v){return'¥'+(Number(v)||0).toFixed(2);}
function esc(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function trunc(s,n){if(!s)return'';return s.length>n?s.slice(0,n)+'…':s;}

function buildPagination(offset,total,size,fn){
  const pages=Math.ceil(total/size)||1;
  if(pages<=1)return'';
  const cur=Math.floor(offset/size);
  let h=`<div class="pagination"><span class="page-info">共 ${total} 条 / ${pages} 页</span>`;
  h+=`<button class="page-btn" ${cur===0?'disabled':''} onclick="${fn}(0)">«</button>`;
  for(let i=Math.max(0,cur-2);i<Math.min(pages,cur+3);i++){
    h+=`<button class="page-btn${i===cur?' active':''}" onclick="${fn}(${i*size})">${i+1}</button>`;
  }
  h+=`<button class="page-btn" ${(offset+size)>=total?'disabled':''} onclick="${fn}(${Math.max(0,total-size)})">»</button></div>`;
  return h;
}

// ============================================================ 图片预览 ============================================================
const pv = { list: [], idx: 0, scaled: false };
function openPreview(list, idx){
  const urls = (list||[]).filter(Boolean).map(normalizeImg);
  if (!urls.length) return;
  pv.list = urls;
  pv.idx = Math.min(Math.max(idx||0,0), urls.length-1);
  pv.scaled = false;
  updatePreview();
  document.getElementById('img-preview').classList.add('show');
  document.getElementById('img-preview-prev').style.display = urls.length>1 ? '' : 'none';
  document.getElementById('img-preview-next').style.display = urls.length>1 ? '' : 'none';
  document.getElementById('img-preview').addEventListener('touchstart', pvTStart, {once:true});
}
function updatePreview(){
  const img = document.getElementById('img-preview-img');
  img.src = pv.list[pv.idx];
  img.classList.toggle('scale-2x', pv.scaled);
  document.getElementById('img-preview-counter').textContent = (pv.idx+1)+'/'+pv.list.length;
}
function closePreview(){
  document.getElementById('img-preview').classList.remove('show');
  pv.list = []; pv.idx = 0; pv.scaled = false;
}
function prevPreview(){ pv.idx = (pv.idx-1+pv.list.length)%pv.list.length; pv.scaled=false; updatePreview(); }
function nextPreview(){ pv.idx = (pv.idx+1)%pv.list.length; pv.scaled=false; updatePreview(); }
function toggleScalePreview(){ pv.scaled = !pv.scaled; updatePreview(); }
let pvTouchX = 0;
function pvTStart(e){ pvTouchX = e.touches[0].clientX; document.getElementById('img-preview').addEventListener('touchmove', pvTEnd, {once:true}); }
function pvTEnd(e){
  const dx = e.changedTouches[0].clientX - pvTouchX;
  if (Math.abs(dx)>60){ if(dx<0)nextPreview(); else prevPreview(); }
}
document.addEventListener('keydown', function(e){ if(e.key==='Escape' && document.getElementById('img-preview').classList.contains('show')) closePreview(); });

// 动态卡片渲染（内容全文 + 图片预览 + 点赞用户 + 评论）
function renderPostCard(p){
  const imgs = (p.images||[]).map(normalizeImg).filter(Boolean);
  const imgHtml = imgs.length?`<div class="post-imgs">${imgs.map((u,i)=>`<img src="${esc(u)}" onclick="${imgPreviewAttr(imgs,i)}">`).join('')}</div>`:'';
  const likeUsers = (p.likes||[]).map(l=>l).slice(0,10);
  const likeMore = (p.likes||[]).length - likeUsers.length;
  const likersHtml = (p.likes||[]).length?`<div class="post-likers">👍 <strong>${p.like_count_detail||p.like_count||0}</strong> 位点赞:
    ${likeUsers.map(l=>`<span>${l.avatar?`<img src="${esc(normalizeImg(l.avatar))}" title="${esc(l.nickname||'用户'+l.user_id)}">`:''}${esc(l.nickname||'用户'+l.user_id)}</span>`).join('')}
    ${likeMore>0?`<span>+${likeMore}</span>`:''}
  </div>`:`<div class="post-likers">👍 ${p.like_count_detail||p.like_count||0} 位点赞</div>`;
  const commentsHtml = renderComments(p.comments||[]);
  return `<div class="post-card">
    <div class="post-meta">
      <span>📝 动态 #${p.id}</span>
      <span>${p.status===1?'<span class="tag tag-success">正常</span>':'<span class="tag tag-default">已删除</span>'}</span>
      <span>👍 ${p.like_count_detail||p.like_count||0}</span>
      <span>💬 ${p.comment_count_detail||p.comment_count||0}</span>
      ${p.view_count!==undefined?`<span>👀 ${p.view_count}</span>`:''}
      <span>🕐 ${fmtTime(p.created_at)}</span>
    </div>
    ${p.content?`<div class="post-content">${esc(p.content)}</div>`:''}
    ${imgHtml}
    ${likersHtml}
    <div class="post-comments">${commentsHtml}</div>
  </div>`;
}

function renderComments(comments){
  if (!comments.length) return '<div style="font-size:12px;color:var(--text-muted)">暂无评论</div>';
  return comments.map(c=>`
    <div class="comment-item">
      <span class="c-nick">${esc(c.nickname||'用户'+c.user_id)}</span>
      <span>${esc(c.content)}</span><span class="c-time">${fmtTime(c.created_at)}</span>
      ${(c.replies||[]).map(r=>`<div class="c-reply"><span class="c-nick">${esc(r.nickname||'用户'+r.user_id)}</span>回复@${esc(c.nickname||'')}：${esc(r.content)}<span class="c-time">${fmtTime(r.created_at)}</span></div>`).join('')}
    </div>`).join('');
}

// 消息按对端分组（手风琴）
function renderMsgGroups(msgs, uid){
  // 按 peer_id 分组
  const groups = {};
  msgs.forEach(m=>{
    const pid = m.peer_id;
    if (!groups[pid]) groups[pid] = { peer_id: pid, peer_nickname: m.peer_nickname||('用户'+pid), peer_avatar: m.peer_avatar, items: [] };
    groups[pid].items.push(m);
  });
  // 组按最后消息时间倒序
  const list = Object.values(groups).sort((a,b)=>new Date(b.items[0].created_at)-new Date(a.items[0].created_at));
  if (!S.ud.msgOpen) S.ud.msgOpen = {};
  return `<div class="msg-groups">
    ${list.map(g=>{
      const isOpen = S.ud.msgOpen[g.peer_id];
      return `<div class="msg-group${isOpen?' open':''}" id="mg_${g.peer_id}">
        <div class="msg-group-head" onclick="toggleMsgGroup(${g.peer_id})">
          ${g.peer_avatar?`<img src="${esc(normalizeImg(g.peer_avatar))}">`:'<span style="width:34px;height:34px;border-radius:50%;background:var(--primary-light);display:flex;align-items:center;justify-content:center">👤</span>'}
          <div class="mg-info">
            <div class="mg-name">${esc(g.peer_nickname)} <span class="tag tag-primary" style="font-size:10px">${g.items.length}条</span></div>
            <div class="mg-sub">${fmtTime(g.items[0].created_at)}</div>
          </div>
          <span class="mg-arrow">›</span>
        </div>
        <div class="msg-group-body">${renderMsgBubbles(g.items)}</div>
      </div>`;
    }).join('')}
  </div>`;
}

function toggleMsgGroup(peerId){
  S.ud.msgOpen[peerId] = !S.ud.msgOpen[peerId];
  const el = document.getElementById('mg_'+peerId);
  if (el) el.classList.toggle('open', S.ud.msgOpen[peerId]);
}

function renderMsgBubbles(items){
  return items.map(m=>{
    const avatar = normalizeImg(m.peer_avatar);
    const content = m.is_recalled ? '<span style="color:var(--text-muted)">[已撤回]</span>'
      : (m.type===1 ? `<img src="${esc(normalizeImg(m.content))}" onclick="${imgPreviewAttr([m.content],0)}">`
        : (m.type===6 ? `🎁 ${esc(m.content||'礼物消息')}`
          : esc(trunc(m.content||'',120))));
    const avHtml = m.direction==='received' && avatar ? `<img class="mb-avatar" src="${esc(avatar)}">` : '<span class="mb-avatar" style="display:none"></span>';
    return `<div class="msg-bubble ${m.direction}">
      ${avHtml}
      <div class="mb-content">${content}</div>
      <span class="mb-time">${fmtTime(m.created_at)}</span>
    </div>`;
  }).join('');
}

// 行为聚合渲染（按行为方式一级分类，每类内分发出/收到）
function renderBehaviors(b){
  const typeMeta = {
    view_profile:{i:'👀',l:'查看主页'}, like_user:{i:'💕',l:'喜欢用户'},
    like_post:{i:'👍',l:'点赞动态'}, comment_post:{i:'💬',l:'评论动态'},
    message_send:{i:'💬',l:'消息'}, message_recv:{i:'💬',l:'消息'},
    match:{i:'💑',l:'匹配成功'}, slide:{i:'🎯',l:'滑动操作'},
    gift_send:{i:'🎁',l:'送出礼物'}, gift_recv:{i:'🎁',l:'收到礼物'}
  };
  const slideName = (b.slide_labels||{});
  // 合并发出+收到，按行为方式(type)分组
  const all = [...(b.sent||[]), ...(b.received||[])];
  if (!all.length) return '<div class="empty-row">暂无行为记录</div>';
  const byType = {};
  all.forEach(x=>{ const k=x.type||'other'; (byType[k]=byType[k]||[]).push(x); });

  function behItem(x){
    const isSlide = x.type==='slide';
    const dirTag = x.direction==='sent'
      ? '<span class="tag tag-primary">发出</span>'
      : '<span class="tag tag-warning">收到</span>';
    return `<div class="beh-item">
      ${x.peer&&x.peer.avatar?`<img src="${esc(normalizeImg(x.peer.avatar))}">`:'<span style="width:24px;height:24px;border-radius:50%;background:var(--primary-light);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0">👤</span>'}
      <div class="bi-info">
        <div class="bi-main">
          ${dirTag}
          ${x.peer?` <strong>${esc(x.peer.nickname||'用户'+x.peer.id)}</strong>`:''}
          ${isSlide&&slideName[x.action]?` <span class="tag tag-primary">${slideName[x.action]}</span>`:''}
          ${x.post?` · 动态#${x.post.id}「${esc(trunc(x.post.content||'',20))}」`:''}
          ${x.comment_content?` · 评论: ${esc(trunc(x.comment_content,30))}`:''}
          ${x.message_preview?` · ${esc(trunc(x.message_preview,30))}`:''}
        </div>
        <div class="bi-sub">${fmtTime(x.created_at)}</div>
      </div>
    </div>`;
  }

  let html = '';
  for (const [type, items] of Object.entries(byType)){
    const meta = typeMeta[type] || {i:'•',l:type};
    const sentItems = items.filter(x=>x.direction==='sent');
    const recvItems = items.filter(x=>x.direction==='received');
    html += `<div class="section-card" style="margin-bottom:12px">
      <div class="section-header"><h4>${meta.i} ${meta.l} <span class="tag tag-default" style="font-weight:400">${items.length}次</span></h4></div>
      <div class="section-body" style="padding:10px 14px">
        ${sentItems.length?`<div class="beh-block-title" style="margin-top:0">📤 发出 ${sentItems.length}</div>`:''}
        ${sentItems.map(behItem).join('')}
        ${recvItems.length?`<div class="beh-block-title">📥 收到 ${recvItems.length}</div>`:''}
        ${recvItems.map(behItem).join('')}
      </div>
    </div>`;
  }
  return html;
}

async function giftForm(id){
  let g = {name:'',image:'',price:'',animation_type:'normal',category:'通用',sort_order:0,is_active:1};
  let title = '新增礼物';
  if (id) {
    try { const found = (await api('GET','/api/admin/gifts')).data.find(x=>x.id===id); if(found){g=found;title='编辑礼物';} } catch(e){}
  }
  showModal(`
    <h3>${title}</h3>
    <div class="form-row">
      <div class="form-item"><label>名称 *</label><input id="gn" value="${esc(g.name)}"></div>
      <div class="form-item"><label>价格(金币) *</label><input id="gp" type="number" value="${g.price||''}" min="1"></div>
    </div>
    <div class="form-item"><label>图片URL</label><input id="gi" value="${esc(g.image||'')}" placeholder="/gifts/xxx.png"></div>
    <div class="form-row">
      <div class="form-item"><label>分类</label><select id="gc">${['通用','鲜花','甜品','首饰','奢侈品','特效'].map(c=>`<option value="${c}" ${g.category===c?'selected':''}>${c}</option>`).join('')}</select></div>
      <div class="form-item"><label>动画类型</label><select id="ga">${['normal','rose','luxury','firework'].map(a=>`<option value="${a}" ${g.animation_type===a?'selected':''}>${a}</option>`).join('')}</select></div>
    </div>
    <div class="form-item"><label>排序</label><input id="gs" type="number" value="${g.sort_order||0}"></div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveGift(${id||0})">💾 保存</button>
    </div>
  `);
}
async function saveGift(id){
  const body = {name:document.getElementById('gn').value.trim(),image:document.getElementById('gi').value.trim(),price:Number(document.getElementById('gp').value),sort_order:Number(document.getElementById('gs').value),category:document.getElementById('gc').value,animation_type:document.getElementById('ga').value};
  if(!body.name||!body.price){toast('请填写名称和价格','error');return;}
  try {
    if(id){await api('PUT','/api/admin/gifts/'+id,body);toast('更新成功','success');}
    else{await api('POST','/api/admin/gifts',body);toast('创建成功','success');}
    closeModal();loadGifts();
  } catch(e){toast(e.message,'error');}
}
async function togGift(id,isActive){
  try { await api('PUT','/api/admin/gifts/'+id+'/toggle',{is_active:isActive}); toast(isActive?'已上架':'已下架','success'); loadGifts(); }
  catch(e){ toast(e.message,'error'); }
}

function renderPermTags(u){
  if (u.admin_role === 'super_admin') return '<span class="tag tag-danger">全部权限</span>';
  const perms = u.permissions || [];
  if (!perms.length) return '<span class="tag tag-default">角色默认</span>';
  return perms.map(p=>p==='*'?'<span class="tag tag-danger">全部</span>':`<span class="tag tag-primary">${esc(p)}</span>`).join(' ');
}

let _permCache = null; // 权限目录缓存
async function ensurePermData(){
  if (_permCache) return _permCache;
  _permCache = { catalog: S.permCatalog, roles: S.rolePermissions };
  return _permCache;
}

function adminForm(id){
  ensurePermData().then(({catalog, roles}) => {
    const isEdit = !!id;
    const admins = S._adminsCache || [];
    const u = isEdit ? admins.find(x=>x.id===id) : null;
    const role = u ? (u.admin_role||'admin') : 'admin';
    const perms = u && u.permissions ? u.permissions : (roles[role]||[]).slice();
    renderAdminForm(isEdit, u, role, perms, catalog, roles);
  });
}

function renderAdminForm(isEdit, u, role, perms, catalog, roles){
  // 权限目录按 group 分组
  const groups = {};
  (catalog||[]).forEach(c=>{ (groups[c.group]=groups[c.group]||[]).push(c); });
  showModal(`
    <h3>${isEdit?'编辑管理员':'新增管理员'}</h3>
    ${isEdit?'':`<div class="form-item"><label>用户ID *</label><input id="admUid" type="number" placeholder="用户ID"></div>`}
    <div class="form-item"><label>角色</label><select id="admRole" onchange="onRoleChange()">
      ${['super_admin','admin','operator','auditor','cs'].filter(r=>!isEdit||u.admin_role==='super_admin'?true:r!=='super_admin').map(r=>`<option value="${r}" ${role===r?'selected':''}>${r}</option>`).join('')}
    </select></div>
    <div class="form-item"><label>权限配置</label>
      <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">切换角色自动填充默认权限，可手动勾选覆盖</div>
      <div class="perm-grid" id="permGrid">${renderPermGrid(perms, groups)}</div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveAdmin(${isEdit?u.id:0})">💾 保存</button>
    </div>
  `);
}

function renderPermGrid(perms, groups){
  if (!groups || !Object.keys(groups).length) return '<div style="font-size:12px;color:var(--text-muted)">无权限目录</div>';
  let h = '';
  for (const [group, items] of Object.entries(groups)) {
    h += `<div class="perm-group-label">${esc(group)}</div><div style="display:flex;flex-wrap:wrap;gap:8px">`;
    for (const it of items) {
      const checked = perms.includes('*') || perms.includes(it.key);
      h += `<label class="perm-item${checked?' checked':''}" onclick="togglePerm(this)">
        <input type="checkbox" ${checked?'checked':''} value="${it.key}"> ${esc(it.label)}
      </label>`;
    }
    h += '</div>';
  }
  return h;
}

// 勾选切换（点 label 翻转 checkbox）
function togglePerm(el){
  const box = el.querySelector('input');
  box.checked = !box.checked;
  el.classList.toggle('checked', box.checked);
}

function onRoleChange(){
  const role = document.getElementById('admRole').value;
  const defaultPerms = (S.rolePermissions[role]||[]).slice();
  // 重新渲染勾选区（默认权限预填）
  const grid = document.getElementById('permGrid');
  if (grid) grid.innerHTML = renderPermGrid(defaultPerms, permCatalogToGroups());
}

function permCatalogToGroups(){
  const groups = {};
  (S.permCatalog||[]).forEach(c=>{ (groups[c.group]=groups[c.group]||[]).push(c); });
  return groups;
}

async function saveAdmin(id){
  const admin_role = document.getElementById('admRole').value;
  const perms = [...document.querySelectorAll('#permGrid input:checked')].map(i=>i.value);
  // '*' 单独处理：勾选了超集则存通配
  const finalPerms = perms;
  if (id) {
    // 编辑
    try{ await api('PUT','/api/admin/admins/'+id,{admin_role, permissions:finalPerms}); toast('管理员已更新','success'); closeModal(); loadAdmins(); }
    catch(e){ toast(e.message,'error'); }
  } else {
    const user_id = Number(document.getElementById('admUid').value);
    if(!user_id){ toast('请填写用户ID','error'); return; }
    try{ await api('POST','/api/admin/admins',{user_id, admin_role, permissions:finalPerms}); toast('管理员已创建','success'); closeModal(); loadAdmins(); }
    catch(e){ toast(e.message,'error'); }
  }
}
async function adminToggle(id,isActive){
  try{await api('PUT','/api/admin/admins/'+id,{is_active:isActive});toast(isActive?'已启用':'已停用','success');loadAdmins();}
  catch(e){toast(e.message,'error');}
}
async function adminDel(id){
  try{await api('DELETE','/api/admin/admins/'+id);toast('已删除','success');loadAdmins();}
  catch(e){toast(e.message,'error');}
}

// ============================================================ Push ============================================================
function renderPush(){ loadPush(); }
async function loadPush(){
  const area = document.getElementById('content-area');
  area.innerHTML = '<div class="loading-center"><div class="spinner"></div>加载中...</div>';
  try {
    const [h,t]=await Promise.all([api('GET','/api/admin/push/history'),api('GET','/api/admin/push/templates')]);
    const hist=h.data||[]; const templates=t.data||[];
    let tpl = `
      <div class="section-card"><div class="section-header"><h4>📣 发送推送</h4></div>
      <div class="section-body" style="padding:16px">
        <div class="form-row">
          <div class="form-item"><label>标题 *</label><input id="pushTitle" placeholder="推送标题"></div>
          <div class="form-item"><label>目标</label><select id="pushTarget"><option value="all">全部用户</option><option value="active">活跃用户</option></select></div>
        </div>
        <div class="form-item"><label>内容 *</label><textarea id="pushContent" rows="3" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;box-sizing:border-box"></textarea></div>
        <button class="btn btn-primary" onclick="pushSend()">🚀 发送推送</button>
      </div></div>
      <div class="section-card"><div class="section-header"><h4>💾 推送模板</h4><button class="btn btn-default btn-sm" onclick="tplForm()">＋ 新建模板</button></div>
      <div class="section-body"><div class="table-wrap"><table>
        <thead><tr><th>ID</th><th>名称</th><th>标题</th><th>内容</th><th>操作</th></tr></thead>
        <tbody>${templates.length===0?'<tr class="empty-row"><td colspan="5">暂无模板</td></tr>':templates.map(t=>`
          <tr><td>${t.id}</td><td>${esc(t.name)}</td><td>${esc(t.title)}</td><td style="max-width:240px">${esc(trunc(t.content||'',30))}</td>
          <td><button class="btn btn-text btn-xs" onclick="showConfirm('确定删除模板「${esc(t.name)}」？',()=>tplDel(${t.id}))">🗑️</button></td></tr>
        `).join('')}
        </tbody>
      </table></div></div></div>
      <div class="section-card"><div class="section-header"><h4>📤 推送历史</h4></div>
      <div class="section-body"><div class="table-wrap"><table>
        <thead><tr><th>ID</th><th>标题</th><th>目标</th><th>发送数</th><th>状态</th><th>发送时间</th></tr></thead>
        <tbody>${hist.length===0?'<tr class="empty-row"><td colspan="6">暂无推送记录</td></tr>':hist.map(p=>`
          <tr><td>${p.id}</td><td>${esc(p.title)}</td><td>${esc(p.target_type||'all')}</td>
          <td>${p.sent_count||0}/${p.target_count||0}</td>
          <td>${p.status==='sent'?`<span class="badge-success">已发送</span>`:p.status==='sending'?`<span class="badge-warning">发送中</span>`:`<span class="badge-default">${esc(p.status||'draft')}</span>`}</td>
          <td>${fmtTime(p.sent_at||p.created_at)}</td></tr>
        `).join('')}
        </tbody>
      </table></div></div></div>`;
    area.innerHTML = tpl;
  } catch(e){ area.innerHTML = `<div class="loading-center">❌ ${esc(e.message)} <button class="btn btn-text btn-sm" onclick="renderPush()">重试</button></div>`; }
}
async function pushSend(){
  const title=document.getElementById('pushTitle').value.trim();
  const content=document.getElementById('pushContent').value.trim();
  const target_type=document.getElementById('pushTarget').value;
  if(!title||!content){toast('请填写标题和内容','error');return;}
  try{const r=await api('POST','/api/admin/push/send',{title,content,target_type});toast(r.message||`推送成功`,'success');loadPush();}
  catch(e){toast(e.message,'error');}
}
function tplForm(){
  showModal(`
    <h3>＋ 新建推送模板</h3>
    <div class="form-item"><label>模板名称 *</label><input id="tplName"></div>
    <div class="form-item"><label>标题 *</label><input id="tplTitle"></div>
    <div class="form-item"><label>内容 *</label><textarea id="tplContent" rows="3" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:13px;box-sizing:border-box"></textarea></div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveTpl()">💾 保存</button>
    </div>
  `);
}
async function saveTpl(){
  const name=document.getElementById('tplName').value.trim();
  const title=document.getElementById('tplTitle').value.trim();
  const content=document.getElementById('tplContent').value.trim();
  if(!name||!title||!content){toast('请填写完整','error');return;}
  try{await api('POST','/api/admin/push/templates',{name,title,content});toast('模板已创建','success');closeModal();loadPush();}
  catch(e){toast(e.message,'error');}
}
async function tplDel(id){
  try{await api('DELETE','/api/admin/push/templates/'+id);toast('已删除','success');loadPush();}
  catch(e){toast(e.message,'error');}
}

// ============================================================ Verifications ============================================================
function renderVerifications(){ S.filters={offset:0,status:'pending'}; loadVerifications(); }
async function loadVerifications(){
  const area = document.getElementById('content-area');
  area.innerHTML = '<div class="loading-center"><div class="spinner"></div>加载中...</div>';
  try {
    const p = new URLSearchParams({limit:S.pageSize,offset:S.filters.offset});
    if(S.filters.status)p.set('status',S.filters.status);
    const [r,stats]=await Promise.all([api('GET','/api/admin/verifications?'+p),api('GET','/api/admin/verifications/stats')]);
    const {list=[],total=0}=r.data;
    const statRows=stats.data||[];
    const statMap={}; statRows.forEach(s=>{const k=s.verification_type+'_'+s.status;statMap[k]=s.cnt;});
    const typeName={real_name:'实名',face:'人脸',education:'学历',vehicle:'车辆'};
    let h = `
      <div class="summary-row">
        ${['real_name','education','vehicle'].map(t=>`<div class="summary-item">${typeName[t]||t} 待审: <strong>${statMap[t+'_pending']||0}</strong></div>`).join('')}
      </div>
      <div class="toolbar">
        <select id="vfStatus" onchange="S.filters.status=this.value;S.filters.offset=0;loadVerifications()">
          <option value="pending" ${S.filters.status==='pending'?'selected':''}>待审核</option>
          <option value="approved" ${S.filters.status==='approved'?'selected':''}>已通过</option>
          <option value="rejected" ${S.filters.status==='rejected'?'selected':''}>已拒绝</option>
          <option value="none" ${S.filters.status==='none'?'selected':''}>全部</option>
        </select>
      </div>
      <div class="section-card"><div class="section-header"><h4>✅ 认证审核</h4></div>
      <div class="section-body"><div class="table-wrap"><table>
        <thead><tr><th>ID</th><th>用户</th><th>手机号</th><th>类型</th><th>状态</th><th>提交时间</th><th>操作</th></tr></thead>
        <tbody>${list.length===0?'<tr class="empty-row"><td colspan="7">暂无记录</td></tr>':list.map(v=>`
          <tr>
            <td>${v.id}</td><td>${esc(v.nickname||('-')+' ('+v.user_id+')')}</td><td>${esc(v.phone||'-')}</td>
            <td>${esc(typeName[v.verification_type]||v.verification_type)}</td>
            <td>${v.status==='pending'?`<span class="badge-warning">待审</span>`:v.status==='approved'?`<span class="badge-success">通过</span>`:`<span class="badge-danger">拒绝</span>`}</td>
            <td>${fmtTime(v.created_at)}</td>
            <td>${v.status==='pending'?`
              <button class="btn btn-success btn-xs" onclick="vfHandle(${v.id},'approve')">通过</button>
              <button class="btn btn-danger btn-xs" onclick="vfReject(${v.id})">拒绝</button>`:'—'}
            </td>
          </tr>`).join('')}
        </tbody>
      </table></div></div>
      ${buildPagination(S.filters.offset,total,S.pageSize,'vfPage')}
      </div>`;
    area.innerHTML = h;
  } catch(e){ area.innerHTML = `<div class="loading-center">❌ ${esc(e.message)} <button class="btn btn-text btn-sm" onclick="renderVerifications()">重试</button></div>`; }
}
function vfPage(o){S.filters.offset=o;loadVerifications();}
async function vfHandle(id,act){
  try{await api('PUT',`/api/admin/verifications/${id}/${act}`);toast('审核通过','success');loadVerifications();}
  catch(e){toast(e.message,'error');}
}
function vfReject(id){
  showModal(`
    <h3>❌ 拒绝认证</h3>
    <div class="form-item"><label>拒绝原因</label><input id="vfReason" placeholder="请输入拒绝原因"></div>
    <div class="modal-footer">
      <button class="btn btn-default" onclick="closeModal()">取消</button>
      <button class="btn btn-danger" onclick="vfRejectSubmit(${id})">确认拒绝</button>
    </div>
  `);
}
async function vfRejectSubmit(id){
  const reason=document.getElementById('vfReason').value.trim();
  try{await api('PUT',`/api/admin/verifications/${id}/reject`,{reason});toast('已拒绝','success');closeModal();loadVerifications();}
  catch(e){toast(e.message,'error');}
}

document.getElementById('login-phone').addEventListener('keydown',function(e){if(e.key==='Enter')adminLogin();});
